# ============================================================
# PT DIDIN TENDA DECORATION
# Canonical domain:
# https://didintenda.my.id
# ============================================================


# ------------------------------------------------------------
# Redirect WWW ke non-WWW
# ------------------------------------------------------------
server {
    listen 80;

    server_name www.didintenda.my.id;

    return 301 https://didintenda.my.id$request_uri;
}


# ------------------------------------------------------------
# Domain utama
# ------------------------------------------------------------
server {
    listen 80 default_server;

    server_name didintenda.my.id localhost _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 100M;

    access_log /var/log/nginx/didintenda.access.log;
    error_log  /var/log/nginx/didintenda.error.log warn;


    # --------------------------------------------------------
    # Redirect HTTP publik ke HTTPS.
    # Aman digunakan di belakang Cloudflare Tunnel.
    # Request lokal tanpa header ini tetap dapat diproses.
    # --------------------------------------------------------
    if ($http_x_forwarded_proto = "http") {
        return 301 https://didintenda.my.id$request_uri;
    }


    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # --------------------------------------------------------
    # File standar
    # --------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }


    # --------------------------------------------------------
    # Laravel front controller
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # --------------------------------------------------------
    # Asset hasil build Vite
    # --------------------------------------------------------
    location ^~ /build/ {
        try_files $uri =404;

        expires 1y;
        access_log off;
        log_not_found off;
    }


    # --------------------------------------------------------
    # File public storage Laravel
    # --------------------------------------------------------
    location ^~ /storage/ {
        try_files $uri =404;

        expires 7d;
        access_log off;
        log_not_found off;
    }


    # --------------------------------------------------------
    # Eksekusi hanya melalui index.php Laravel
    # --------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_tenda:9000;
        fastcgi_index index.php;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Memberi tahu Laravel bahwa koneksi publik menggunakan HTTPS,
        # meskipun Cloudflare Tunnel terhubung ke origin melalui HTTP.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;

        fastcgi_pass_request_headers on;
        fastcgi_read_timeout 300;

        internal;
    }


    # Mencegah file PHP lain dijalankan langsung
    location ~ \.php$ {
        return 404;
    }


    # Mencegah akses ke file tersembunyi seperti .env dan .git
    location ~ /\.(?!well-known).* {
        deny all;
    }
}